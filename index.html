<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Kalkulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="Kalkulator">
        <div id="display" class="display">0</div>
        <div class="buttons">
            <button class="function" onclick="action('C')">C</button>
            <button class="function" onclick="action('±')">±</button>
            <button class="function" onclick="action('%')">%</button>
            <button class="operator" onclick="action('/')">÷</button>
            
            <button class="function" onclick="action('7')">7</button>
            <button class="function" onclick="action('8')">8</button>
            <button class="function" onclick="action('9')">9</button>
            <button class="operator" onclick="action('*')">x</button>
            
            <button class="function" onclick="action('4')">4</button>
            <button class="function" onclick="action('5')">5</button>
            <button class="function" onclick="action('6')">6</button>
            <button class="operator" onclick="action('-')">-</button>
            
            <button class="function" onclick="action('1')">1</button>
            <button class="function" onclick="action('2')">2</button>
            <button class="function" onclick="action('3')">3</button>
            <button class="operator" onclick="action('+')">+</button>

            <button class="nol" onclick="action('0')">0</button>
            <button onclick="action(',')">,</button>
            <button class="operator" onclick="action('=')">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
